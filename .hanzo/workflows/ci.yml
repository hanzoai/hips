name: ci

# Native CI on git.hanzo.ai. Runs the SAME lint a contributor runs locally:
#
#     python3 scripts/lint-hips.py
#
# This job used to carry its own copy of the checks as an inline heredoc, so the
# gate existed only on the forge and a failure could not be reproduced without
# pushing. Two implementations of one rule is the defect this repository exists
# to name. There is now one, in scripts/lint-hips.py, and this file calls it.
#
# Every check fires on a defect that was actually present in HIPs/: five specs
# unreachable from the index, two files both claiming hip: 0127, a HIP with no
# status shipping green, 101 H1 headings disagreeing with their own front
# matter, and a second index that described 25 HIPs while 138 existed.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      # The lint's own test suite runs FIRST. It breaks a scratch copy of the
      # corpus 22 ways and requires the lint to report the matching code for
      # each, plus asserts that every declared check has a test. A green lint
      # whose checks have never been seen to fail is indistinguishable from a
      # lint that returns success unconditionally -- which is exactly what the
      # GitHub workflow this replaced did.
      - name: the lint fails when it should
        run: python3 scripts/test-lint-hips.py

      - name: every HIP is structurally sound, and the index matches
        run: python3 scripts/lint-hips.py

      # The capability list is an INPUT, so it is checked out rather than
      # copied here. A snapshot committed into this repo would be a second
      # statement of which capabilities exist, and it would drift from the one
      # the cloud actually serves -- which is the whole thing the ratchet below
      # exists to catch.
      - uses: actions/checkout@v4
        with:
          repository: hanzoai/openapi
          path: .capabilities

      # One capability, one HIP. The ratchet (capability-coverage.txt) carries
      # what has no spec yet and may only SHRINK, so a capability shipping
      # without one fails here instead of going unnoticed. coverage.py refuses
      # to report at all if it cannot resolve the list -- a coverage gate that
      # passes when its input is missing has not been shown to work.
      - name: every capability has a HIP
        env:
          HANZO_CAPABILITIES: .capabilities/capabilities.yaml
        run: python3 scripts/coverage.py
