name: deploy

# Builds the static export and publishes it to the Sites plane through hanzoai/ci's
# site action, which reads the deploy key from KMS.

on:
  push:
    branches: [main]
    paths: ['HIPs/**', 'docs/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  # The site flips live at completion, so a cancelled run leaves the live site untouched.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: [linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm comes from corepack, pinned by docs/package.json packageManager.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build the static export
        run: |
          set -euo pipefail
          corepack enable
          # docs/ reads ../HIPs relative to the working directory.
          cd docs
          pnpm install --frozen-lockfile
          pnpm build
          test -d out || { echo "::error::pnpm build produced no docs/out"; exit 1; }
          echo "exported $(find out -type f | wc -l) files"

      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: hips
          dir: docs/out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
