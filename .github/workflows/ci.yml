name: ci

# The same checks a contributor runs locally: python3 scripts/lint-hips.py and friends.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # The capability list is an input, read from hanzoai/openapi, never copied here.
      - uses: actions/checkout@v4
        with:
          repository: hanzoai/openapi
          path: .capabilities

      # index.py reads capabilities.yaml with PyYAML, and the runner image carries
      # a bare Python. Without it the generator's own test refuses and every step
      # after it is skipped.
      - name: PyYAML
        run: |
          python3 -c 'import yaml' 2>/dev/null ||
            python3 -m pip install --quiet --user --break-system-packages pyyaml ||
            python3 -m pip install --quiet --user pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: the lint fails when it should
        run: python3 scripts/test-lint-hips.py

      - name: every HIP is structurally sound
        run: python3 scripts/lint-hips.py

      - name: the generator refuses when it should
        env:
          HANZO_CAPABILITIES: .capabilities/capabilities.yaml
        run: python3 scripts/test-index.py

      - name: README is exactly what HIPs/ projects to
        env:
          HANZO_CAPABILITIES: .capabilities/capabilities.yaml
        run: python3 scripts/index.py --check

      # capability-coverage.txt lists capabilities with no HIP and may only shrink.
      - name: every capability has a HIP
        env:
          HANZO_CAPABILITIES: .capabilities/capabilities.yaml
        run: python3 scripts/coverage.py
